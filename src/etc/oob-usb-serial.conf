# oob-usb-serial global configuration
#
# This file is sourced as a shell script; keep it to simple KEY="value" lines.
# These defaults apply to any adapter not matched in devices.conf.

# Default serial line settings (tio vocabulary).
OOB_DEFAULT_BAUD="115200"        # baud rate, e.g. 9600, 115200
OOB_DEFAULT_DATA="8"             # data bits: 5, 6, 7 or 8
OOB_DEFAULT_PARITY="none"        # parity: none, odd or even
OOB_DEFAULT_STOP="1"             # stop bits: 1 or 2
OOB_DEFAULT_FLOW="none"          # flow control: none, soft or hard

# Name of the tmux session that holds all console windows.
OOB_SESSION_NAME="oob"

# Per-console logging. Leave empty to disable. When set to a directory, each
# console is logged to <dir>/<name>.log via tio's logging. The directory must
# be writable by the user running the session.
OOB_LOG_DIR=""

# The user account the boot-time systemd service runs the session as, and the
# account whose login should auto-attach to the session. Create this user (or
# reuse an existing one) before enabling the service.
OOB_USER="oob"
