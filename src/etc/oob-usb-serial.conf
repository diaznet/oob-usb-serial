# oob-usb-serial global configuration
#
# This file is sourced as a shell script; keep it to simple KEY="value" lines.

# Default baud rate for any adapter not matched in devices.conf.
OOB_DEFAULT_SPEED="9600"

# Default serial framing (stty-style, comma-separated) for unmatched adapters.
#   cs8,-parenb,-cstopb  = 8 data bits, no parity, 1 stop bit (8N1)
# Add "crtscts" to enable hardware (RTS/CTS) flow control.
OOB_DEFAULT_FRAMING="cs8,-parenb,-cstopb"

# Name of the GNU screen session that holds all console windows.
OOB_SESSION_NAME="oob"

# The user account the boot-time systemd service runs the session as, and the
# account whose login should auto-attach to the session. Create this user (or
# reuse an existing one) before enabling the service.
OOB_USER="oob"
