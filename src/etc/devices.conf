# oob-usb-serial per-device configuration (INI format)
#
# Map specific USB-to-serial adapters to a friendly console name and serial
# line settings. Adapters are matched by their STABLE udev ID_SERIAL and/or by
# the USB port they are plugged into, not by their /dev/ttyUSBx node (which
# can change across reboots or replugs).
#
# Discover the ID_SERIAL and port of your attached adapters with:
#   oob-usb-serial list
# or let `sudo oob-usb-serial config` write the sections for you.
#
# Format:
#   Each [section] defines one device. The SECTION NAME is the tmux window
#   title (letters, digits, '.', '_' and '-'; anything else becomes '_').
#   Keys (match and/or path required, the rest optional):
#
#     match     shell glob matched against udev ID_SERIAL
#     path      shell glob matched against the /dev/serial/by-path link
#               (full path or basename), i.e. the physical USB port. Use it
#               for adapters that report the same ID_SERIAL (cheap clones
#               without a serial number, ports of a multi-port adapter).
#     baud      baud rate, e.g. 9600, 115200
#     data      data bits: 5, 6, 7 or 8
#     parity    parity: none, odd or even
#     stop      stop bits: 1 or 2
#     flow      flow control: none, soft (XON/XOFF) or hard (RTS/CTS)
#
#   When both match and path are set, both must fit. Omitted keys fall back
#   to the OOB_DEFAULT_* values in oob-usb-serial.conf; invalid values are
#   reported and replaced by the defaults. Sections are matched in order; the
#   first section that fits an adapter wins. Comments start with '#' or ';'.
#
#   Any adapter NOT matched here is opened automatically at the global
#   defaults, so this file may be left empty.
#
# --- Examples (commented out) ---
#
# [device1]
# match  = *FT232R*_A5069RR4
# baud   = 9600
# data   = 8
# parity = none
# stop   = 1
# flow   = none
#
# [device2]
# match  = *Prolific*
# baud   = 38400
# flow   = hard
#
# [device3]
# match  = *CP2102*
# baud   = 115200
# ; data/parity/stop/flow omitted -> use the OOB_DEFAULT_* values
#
# Two identical CH340 clones told apart by USB port:
# [rack-a]
# match  = 1a86_USB_Serial
# path   = *usb-0:1.2:1.0-port0
#
# [rack-b]
# match  = 1a86_USB_Serial
# path   = *usb-0:1.3:1.0-port0
