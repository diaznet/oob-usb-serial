# oob-usb-serial per-device configuration (INI format)
#
# Map specific USB-to-serial adapters to a friendly console name and serial
# line settings. Adapters are matched by their STABLE udev ID_SERIAL, not by
# their /dev/ttyUSBx node (which can change across reboots or replugs).
#
# Discover the ID_SERIAL of your attached adapters with:
#   oob-usb-serial list
#
# Format:
#   Each [section] defines one device. The SECTION NAME is the tmux window
#   title (the friendly console name). Keys (all optional except match):
#
#     match     shell glob matched against udev ID_SERIAL   (required)
#     baud      baud rate, e.g. 9600, 115200
#     data      data bits: 5, 6, 7 or 8
#     parity    parity: none, odd or even
#     stop      stop bits: 1 or 2
#     flow      flow control: none, soft (XON/XOFF) or hard (RTS/CTS)
#
#   Omitted keys fall back to the OOB_DEFAULT_* values in oob-usb-serial.conf.
#   Sections are matched in order; the first section whose `match` glob fits an
#   adapter wins. Comments start with '#' or ';'.
#
#   Any adapter NOT matched here is opened automatically at the global
#   defaults, so this file may be left empty.
#
# --- Examples (commented out) ---
#
# [device1]
# match  = *FT232R*_A5069RR4
# baud   = 9600
# data   = 8
# parity = none
# stop   = 1
# flow   = none
#
# [device2]
# match  = *Prolific*
# baud   = 38400
# flow   = hard
#
# [device3]
# match  = *CP2102*
# baud   = 115200
# ; data/parity/stop/flow omitted -> use the OOB_DEFAULT_* values
