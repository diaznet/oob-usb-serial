# oob-usb-serial per-device configuration (INI format)
#
# Map specific USB-to-serial adapters to a friendly console name, baud rate and
# serial framing. Adapters are matched by their STABLE udev ID_SERIAL, not by
# their /dev/ttyUSBx node (which can change across reboots or replugs).
#
# Discover the ID_SERIAL of your attached adapters with:
#   oob-usb-serial list
#
# Format:
#   Each [section] defines one device. The SECTION NAME is the screen window
#   title (the friendly console name). Keys:
#
#     match     shell glob matched against udev ID_SERIAL   (required)
#     baud      baud rate, e.g. 9600, 19200, 115200         (optional)
#     framing   comma-separated stty options, e.g. cs8,-parenb,-cstopb (optional)
#
#   Omitted baud/framing fall back to the global defaults in
#   oob-usb-serial.conf. Sections are matched in order; the first section whose
#   `match` glob fits an adapter wins.
#
#   Comments start with '#' or ';'. Any adapter NOT matched here is opened
#   automatically at the global defaults, so this file may be left empty.
#
# --- Examples (commented out) ---
#
# [device1]
# match   = *FT232R*_A5069RR4
# baud    = 9600
# framing = cs8,-parenb,-cstopb
#
# [device2]
# match   = *Prolific*
# baud    = 38400
# framing = cs8,parenb,cstopb,crtscts
#
# [device3]
# match   = *CP2102*
# baud    = 115200
# ; framing omitted -> uses OOB_DEFAULT_FRAMING
